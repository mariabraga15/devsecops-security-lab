name: Security Lab
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Application tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  gitleaks:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p reports
      - name: Scan complete Git history (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git .
          --config .gitleaks.toml --redact --report-format sarif
          --report-path reports/gitleaks.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gitleaks-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: mkdir -p reports
      - name: Scan source using repository rules
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          semgrep/semgrep:1.182.0 semgrep scan
          --config security/semgrep.yml --metrics=off --error
          --sarif --output reports/semgrep.sarif src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  trivy:
    name: Trivy ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [filesystem, image]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: mkdir -p reports
      - name: Scan lockfile and configuration
        if: matrix.target == 'filesystem'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          aquasec/trivy:0.76.1 fs --scanners vuln,misconfig
          --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs node_modules --format sarif
          --output reports/trivy-filesystem.sarif .
      - name: Build lab image without starting the app
        if: matrix.target == 'image'
        run: docker build --tag devsecops-lab:scan . && docker save devsecops-lab:scan --output /tmp/lab-image.tar
      - name: Scan application and operating system packages
        if: matrix.target == 'image'
        run: >-
          docker run --rm -v "$PWD:/repo" -v /tmp/lab-image.tar:/tmp/lab-image.tar:ro -w /repo
          aquasec/trivy:0.76.1 image --input /tmp/lab-image.tar
          --severity HIGH,CRITICAL --exit-code 1 --format sarif
          --output reports/trivy-image.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-${{ matrix.target }}-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  dependency-check:
    name: OWASP Dependency-Check SCA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Create database and report directories
        run: mkdir -p reports .cache/dependency-check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/dependency-check
          key: dependency-check-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-13-${{ runner.os }}-
      - name: Scan dependencies (CVSS threshold 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          options=()
          if [ -n "$NVD_API_KEY" ]; then options+=(--nvdApiKey "$NVD_API_KEY"); fi
          docker run --rm -e NVD_API_KEY \
            -v "$PWD:/src:ro" -v "$PWD/reports:/report" \
            -v "$PWD/.cache/dependency-check:/usr/share/dependency-check/data" \
            owasp/dependency-check:13.0.0 \
            --project devsecops-security-lab --scan /src \
            --exclude '/src/.git/**' --exclude '/src/.cache/**' \
            --exclude '/src/reports/**' --format HTML --format JSON \
            --out /report --failOnCVSS 7 "${options[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
          output: reports/codeql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-report
          path: reports/codeql/
          retention-days: 14
          if-no-files-found: warn
